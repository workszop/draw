<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DrawMe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="edu">
  <header class="edu-header"><div class="edu-header-inner">
    <span class="edu-wordmark">DrawMe</span>
    <span class="edu-tag">demo lab – Elements</span>
    <div class="header-controls" id="header-controls"></div>
  </div></header>

  <main id="app" data-state="idle" data-phase="" data-provider=""></main>

  <div id="live-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <footer class="edu-footer" id="footer-hint">Keyboard shortcuts: 1-9 and 0 / - / = pick a candidate (cells 10-12), Space pauses or resumes, Enter advances the review now, S saves the portrait once done.</footer>

  <div id="probes" style="display:none"></div>

  <script src="pen.js"></script>
  <script src="genome.js"></script>
  <script src="ai-models.js"></script>
